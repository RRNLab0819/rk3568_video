# RK3568 AI Security Camera Configuration
# Default: 4-channel display only (no AI inference)

[camera]
count = 4
device = /dev/video
width  = 1920
height = 1080
fps    = 25

[encoder]
codec   = h265
bitrate = 4000000
gop     = 25

[inference]
enabled         = false        # default OFF: display only, no AI
model           = /userdata/yolov5.rknn
interval        = 1
conf            = 0.15
nms             = 0.45
person_only     = true
person_conf     = 0.05
smooth_enable   = false
smooth_alpha    = 0.05
min_persist     = 1
channels        = 0
round_robin     = false
rga_preprocess  = false

[display]
enabled  = true

[output]
pattern  = /tmp/cam_%d.h264
frames   = 0
