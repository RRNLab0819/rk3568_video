<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RK3568 WebRTC Probe</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #101214;
      color: #e8ecef;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: #1b2025;
      border-bottom: 1px solid #30363d;
      font-size: 14px;
    }
    input, button {
      height: 32px;
      border: 1px solid #3b424a;
      background: #12161a;
      color: #f4f7f9;
      padding: 0 10px;
      font-size: 14px;
    }
    input {
      min-width: 260px;
      flex: 1;
    }
    button {
      cursor: pointer;
      background: #2364aa;
      border-color: #337bc7;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #status {
      min-width: 180px;
      color: #9fb2c3;
    }
  </style>
</head>
<body>
  <header>
    <span>WHEP</span>
    <input id="url" value="http://192.168.2.54:8889/cam0/whep">
    <button id="connect">连接</button>
    <button id="disconnect">断开</button>
    <span id="status">idle</span>
  </header>
  <video id="video" autoplay playsinline muted controls></video>

  <script>
    const url = document.getElementById("url");
    const video = document.getElementById("video");
    const statusEl = document.getElementById("status");
    let pc = null;

    const params = new URLSearchParams(location.search);
    const host = params.get("host");
    const path = params.get("path") || "cam0";
    if (host) {
      url.value = `http://${host}:8889/${path}/whep`;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    async function waitIceGatheringComplete(peer) {
      if (peer.iceGatheringState === "complete") return;
      await new Promise((resolve) => {
        const check = () => {
          if (peer.iceGatheringState === "complete") {
            peer.removeEventListener("icegatheringstatechange", check);
            resolve();
          }
        };
        peer.addEventListener("icegatheringstatechange", check);
      });
    }

    async function connect() {
      disconnect();
      setStatus("connecting");
      pc = new RTCPeerConnection({ iceServers: [] });
      pc.addTransceiver("video", { direction: "recvonly" });
      pc.ontrack = (event) => {
        video.srcObject = event.streams[0];
        setStatus("playing");
      };
      pc.onconnectionstatechange = () => setStatus(pc.connectionState);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitIceGatheringComplete(pc);

      const response = await fetch(url.value, {
        method: "POST",
        headers: { "Content-Type": "application/sdp" },
        body: pc.localDescription.sdp
      });
      if (!response.ok) {
        throw new Error(`WHEP ${response.status}: ${await response.text()}`);
      }
      const answer = await response.text();
      await pc.setRemoteDescription({ type: "answer", sdp: answer });
    }

    function disconnect() {
      if (pc) {
        pc.close();
        pc = null;
      }
      video.srcObject = null;
      setStatus("idle");
    }

    document.getElementById("connect").addEventListener("click", () => {
      connect().catch((error) => setStatus(error.message));
    });
    document.getElementById("disconnect").addEventListener("click", disconnect);
  </script>
</body>
</html>
